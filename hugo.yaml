baseurl: https://justkids.top
languageCode: en-us
theme: hugo-theme-stack
pagerSize: 10
title: JustKids 

# languages:
#     en:
#         languageName: English
#         title: Example Site
#         weight: 1
#     zh-cn:
#         languageName: 中文
#         title: 演示站点
#         weight: 2

# Change it to your Disqus shortname before using
disqusShortname: hugo-theme-stack

# GA Tracking ID
googleAnalytics:

# Theme i18n support
# Available values: ar, ca, de, el, en, es, fr, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: false

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon:

    footer:
        since: 2020
        customText: 真实 | 独立 | 有趣

    dateFormat:
        # published: Jan 02, 2006
        # lastUpdated: Jan 02, 2022 15:04 MST
        published: 2006年1月2日 
        lastUpdated: 2024年8月1日 1点14分

    sidebar:
        emoji: 🍥
        subtitle: 行之于途而应于心
        avatar:
            enabled: false
            local: true
            # src: img/qimanman.jpg

    article:
        math: true
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: giscus

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

        utterances:
            repo:
            issueTerm: pathname
            label:

        remark42:
            host:
            site:
            locale:

        vssue:
            platform:
            owner:
            repo:
            clientId:
            clientSecret:
            autoCreateIssue: false

        waline:
            serverURL:
            lang: zh-CN
            visitor:
            avatar:
            emoji:
            requiredMeta:
            placeholder:
            locale:
                admin: 博主

        twikoo:
            envId:
            region:
            path:
            lang:

        cactus:
            defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
            serverName: "cactus.chat"
            siteName:

        giscus:
            repo: justkids2018/justkids2018.github.io
            repoID: MDEwOlJlcG9zaXRvcnkxNjI0NTUxMTI=
            category: Announcements
            categoryID: DIC_kwDOCa7eSM4CzEjK
            mapping: pathname
            lightTheme: light
            darkTheme: dark
            reactionsEnabled: 1
            emitMetadata: 0
            lang: zh-CN

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:

        cusdis:
            host:
            id:
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 1
            - type: categories
              params:
                  limit: 7
            - type: tag-cloud
              params:
                  limit: 20
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site: 

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: true
            local: false
            src:
    
    colorScheme:
        # Display toggle
        toggle: true
        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true
    image_cdn:
        enabled: false
        host: https://cdn.jsdelivr.net/gh/justkids2018/cdn@main
### Custom menu
