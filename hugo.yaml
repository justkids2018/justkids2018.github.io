### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    
    main:
        # - identifier: main
        #   name: 首页
        #   url: /
        #   weight: -91
        #   params:
        #     icon: archives
            

        - identifier: archive
          name: 归档
          url: /archives
          weight: -90
          params:
            icon: archives

        # - identifier: time
        #   name: 时光列车
        #   url: /time
        #   weight: -80
        #   params:
        #    icon: sun

        # - identifier: read
        #   name: 我的阅读
        #   url: /read
        #   weight: -70
        #   params:
        #    icon: book


    social:
        - identifier: github
          name: GitHub
          url: https://github.com/justkids2018
          params:
              icon: brand-github

        # - identifier: twitter
        #   name: Twitter
        #   url: https://twitter.com
        #   params:
        #       icon: brand-twitter

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: true
        codeFences: true
        guessSyntax: true
        lineNoStart: 0
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 5